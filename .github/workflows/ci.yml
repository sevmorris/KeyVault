name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Barkeep's job: WaxOnWaxOff's build-and-test, less the FFmpeg fetch, since
    # KeyVault bundles no binaries. The repo is public, so the macOS runners are
    # free. KeyVault had no tests to run until KeyVaultTests on 2026-10-04.
    #
    # macos-26 because it is the macOS most users are on, and a build that
    # passes on 15 can still fail on 26: the siblings have hit that twice.
    #
    # xcode-27 because releases are built with Xcode 27 on the owner's Mac, and
    # the 26.3 legs never compile what ships: the macOS 27 SDK and Swift 6.4.
    # Its image is macOS 27, the OS users move to next. GitHub calls it a public
    # preview, with no uptime promise.
    #
    # macos-26-intel because the app ships universal and nothing else runs its
    # x86_64 slice: the other legs and release.sh's tests are arm64. Intel Macs
    # stop at macOS 26, so it is also the newest OS that slice will meet.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: '26.3'
            arch: arm64
          - os: macos-26
            xcode: '26.3'
            arch: arm64
          - os: xcode-27
            xcode: '27.0'
            arch: arm64
          - os: macos-26-intel
            xcode: '26.3'
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # The project is objectVersion 77 (Xcode 16+) and Swift 6 mode; 26.3 is
          # what the sibling apps pin, and 27.0 is the release toolchain on the
          # xcode-27 leg.
          xcode-version: ${{ matrix.xcode }}

      - name: Build and test
        # No scheme is shared in the repo. On a fresh checkout xcodebuild
        # creates one per target, and the KeyVault scheme's test action runs
        # KeyVaultTests. The cap is ClipHack's: a wedged test host fails in
        # minutes instead of burning the job budget.
        timeout-minutes: 15
        run: |
          xcodebuild \
            -project KeyVault/KeyVault.xcodeproj \
            -scheme KeyVault \
            -configuration Debug \
            -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            test
